services:
  mosquitto:
    image: eclipse-mosquitto:2
    # Write the broker config at start so Portainer does not need a host file.
    # A missing bind-mount source is created as a directory and then fails to mount.
    user: "0:0"
    restart: unless-stopped
    ports:
      - "1883:1883"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /mosquitto/config/mosquitto.conf <<'EOF'
        listener 1883
        allow_anonymous true
        persistence true
        persistence_location /mosquitto/data/
        log_dest stdout
        EOF
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  publisher:
    build: ./publisher
    restart: unless-stopped
    environment:
      P2000_MODE: ${P2000_MODE:-sdr}
      P2000_MQTT_HOST: ${P2000_MQTT_HOST:-mosquitto}
      P2000_MQTT_PORT: ${P2000_MQTT_PORT:-1883}
      P2000_MQTT_TOPIC: ${P2000_MQTT_TOPIC:-p2000/alerts}
      P2000_MQTT_STATUS_TOPIC: ${P2000_MQTT_STATUS_TOPIC:-p2000/status}
      P2000_MQTT_USER: ${P2000_MQTT_USER:-}
      P2000_MQTT_PASSWORD: ${P2000_MQTT_PASSWORD:-}
      P2000_FREQUENCY: ${P2000_FREQUENCY:-169.65M}
      P2000_SAMPLE_RATE: ${P2000_SAMPLE_RATE:-22050}
      P2000_GAIN: ${P2000_GAIN:-40}
      P2000_PPM: ${P2000_PPM:-45}
      P2000_MOCK_INTERVAL_SEC: ${P2000_MOCK_INTERVAL_SEC:-12}
      P2000_HISTORY_LIMIT: ${P2000_HISTORY_LIMIT:-200}
      P2000_LOG_LEVEL: ${P2000_LOG_LEVEL:-INFO}
      P2000_DB_PATH: /data/alerts.db
      P2000_FILTERS_PATH: /data/filters.yaml
      P2000_PIPE_PATH: /data/flex.pipe
    volumes:
      - ./data:/data
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    depends_on:
      - mosquitto

  api:
    build: ./api
    restart: unless-stopped
    environment:
      P2000_MODE: ${P2000_MODE:-sdr}
      P2000_DB_PATH: /data/alerts.db
      P2000_HISTORY_LIMIT: ${P2000_HISTORY_LIMIT:-200}
    ports:
      - "${P2000_API_PORT:-8080}:8080"
    volumes:
      - ./data:/data:ro
    depends_on:
      - publisher

volumes:
  mosquitto-data:
  mosquitto-log:
